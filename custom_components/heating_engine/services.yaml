boost:
  fields:
    room:
      required: true
      example: blue_room
      selector:
        text:
    temp:
      required: false
      example: 21
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    minutes:
      required: false
      default: 60
      selector:
        number:
          min: 5
          max: 720
          step: 5
          unit_of_measurement: min

cancel_boost:
  fields:
    room:
      required: true
      example: blue_room
      selector:
        text:

hold:
  fields:
    room:
      required: true
      example: blue_room
      selector:
        text:
    kind:
      required: true
      example: skip
      selector:
        select:
          options:
            - skip
            - eco
            - frost
            - temp
    temp:
      required: false
      example: 18
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    until:
      required: false
      example: next_change
      selector:
        text:

cancel_hold:
  fields:
    room:
      required: true
      example: blue_room
      selector:
        text:

set_exception:
  fields:
    person:
      required: true
      example: pip
      selector:
        text:
    night:
      required: true
      example: "2026-01-08"
      selector:
        date:
    here:
      required: true
      selector:
        boolean:

clear_exception:
  fields:
    person:
      required: true
      example: pip
      selector:
        text:
    night:
      required: true
      example: "2026-01-08"
      selector:
        date:
